<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass Web</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        padding: 48px 24px;
        background: radial-gradient(circle at top, #f6f7fb, #e6ecf7 45%, #d0d9ee);
        color: #0f172a;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
      }
      .links {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      a {
        color: #0b5cff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 32px;
        font-size: 14px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Liquid Glass Web</h1>
      <p>
        Storybook previews and documentation for the Liquid Glass web port.
      </p>
      <div class="links">
        <a href="./docs/">Documentation</a>
        <a href="./storybook/">Storybook</a>
      </div>
      <footer>
        Generated by the GitHub Pages workflow.
      </footer>
    </main>
